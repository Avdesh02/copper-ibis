# Wind turbine telemetry platform.
#
# Every Databricks object created from this bundle carries the `_copper_ibis` suffix,
# matching the git folder name, so it never collides with other work in the workspace.
#
# NOTE: the Unity Catalog catalog itself is NOT created here. This workspace has Default
# Storage enabled, and the catalogs API rejects creation without a managed location
# (400 INVALID_STATE) whether called by the CLI or by a DAB `catalogs:` resource. Run
# `python scripts/bootstrap_catalog.py --target <target>` first; it creates the catalog
# over SQL, which does work. Schemas and volumes below deploy normally.

bundle:
  name: wind_turbine_copper_ibis

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding every layer for this environment.
    default: wind_dev_copper_ibis
  schema_prefix:
    # Prefix for schema names, and for every path and table name derived from them.
    #
    # It must match what the target actually deploys. Under `mode: development` the
    # platform already prefixes resource names with "dev_<identity>_", so this is set
    # to that same value and the schema resources themselves stay unprefixed (adding
    # it there too would double it). Under `mode: production` nothing is prefixed
    # automatically, so the ci target sets "ci_" here and it is applied directly.
    description: Prefix applied to schema names, matching the target's deployment mode.
    default: ""
  schema_resource_prefix:
    # Prefix written into the schema RESOURCE names themselves. Empty under
    # development mode, where the platform adds "dev_<identity>_" on its own; setting
    # it there as well would produce "dev_user_dev_user_raw".
    description: Literal prefix on schema resource names (empty when the mode adds one).
    default: ""
  notification_email:
    description: Address notified when the orchestrator fails.
    default: python3todjango@gmail.com
  window_duration:
    description: Tumbling window for the gold aggregates.
    default: 5 minutes
  rows_per_site:
    description: Sensor events generated per site per simulator run.
    default: "500"
  ci_service_principal:
    # The CI identity GitHub Actions authenticates as. Declared here so every deploy
    # re-grants it CAN_MANAGE, rather than the grants being manual one-offs that get
    # lost the next time a resource is recreated.
    description: Application ID of the service principal used by CI/CD.
    default: d4dc6166-ad2a-4490-a4e7-37cce791f5a9

targets:
  dev:
    default: true
    # development mode prefixes resources with [dev <user>] and pauses schedules, so dev
    # runs stay clearly separated from anything else in this workspace.
    mode: development
    workspace:
      # `host` rather than `profile`: a profile name only exists in a local
      # .databrickscfg, so pinning one breaks CI, where the CLI authenticates from
      # DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET. With `host`, both work --
      # locally the CLI matches it to the `wind` profile, and in CI it uses the
      # service principal. DATABRICKS_HOST overrides this when set.
      host: https://dbc-0090b005-ba2d.cloud.databricks.com
    variables:
      catalog: wind_dev_copper_ibis
      # Mirrors the prefix development mode applies to the schema resources, so paths
      # and table names resolve to the same schemas the platform actually created.
      schema_prefix: "dev_${workspace.current_user.short_name}_"
    permissions:
      # Once a permissions block exists it must name every identity that manages the
      # bundle, the deploying user included - otherwise the workspace folder carries a
      # grant the bundle does not declare and strict validation fails.
      - user_name: python3todjango@gmail.com
        level: CAN_MANAGE
      - service_principal_name: ${var.ci_service_principal}
        level: CAN_MANAGE

  # Shared integration environment deployed by CI on every merge.
  #
  # Uses `mode: production` rather than `development` deliberately. Development mode
  # prefixes every object with the *deploying identity*, so a CI deploy would stand up
  # a second parallel stack named after the service principal instead of updating the
  # shared one. Production mode keeps the names stable, which is what a shared
  # environment needs; it still points at the dev catalog, and the schedule stays
  # paused because only prod overrides pause_status.
  ci:
    mode: production
    workspace:
      host: https://dbc-0090b005-ba2d.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: wind_dev_copper_ibis
      schema_prefix: "ci_"
      schema_resource_prefix: "ci_"
    permissions:
      - user_name: python3todjango@gmail.com
        level: CAN_MANAGE
      - service_principal_name: ${var.ci_service_principal}
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://dbc-0090b005-ba2d.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: wind_prod_copper_ibis
      # production mode does not prefix resource names.
      schema_prefix: ""
      window_duration: 15 minutes
      rows_per_site: "5000"
    permissions:
      - user_name: python3todjango@gmail.com
        level: CAN_MANAGE
      # The CI service principal deploys prod, so it owns the bundle's workspace
      # folder. Declaring it here keeps `validate --strict` clean: otherwise the
      # folder carries a CAN_MANAGE grant the bundle does not account for, which
      # strict mode treats as an error.
      - service_principal_name: ${var.ci_service_principal}
        level: CAN_MANAGE
    # Prod-only overrides of values that default to the dev-safe setting.
    resources:
      jobs:
        wind_turbine_orchestrator:
          schedule:
            pause_status: UNPAUSED
