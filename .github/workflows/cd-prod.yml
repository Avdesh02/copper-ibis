name: Deploy to prod

# Manual only. Production deploys are never triggered by a merge.
#
# The `production` GitHub Environment should be configured with required reviewers, so
# this waits for an approval before the deploy job starts.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm a production deployment
        required: true
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  guard:
    name: Check confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Verify the confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "Refusing: type 'deploy' to confirm (got '${{ inputs.confirm }}')."
            exit 1
          fi

  test:
    name: Lint and test
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -v

  deploy:
    name: Bootstrap and deploy
    needs: test
    runs-on: ubuntu-latest
    # Gates on the environment's required reviewers.
    environment: production
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: databricks/setup-cli@main

      - name: Bootstrap catalog
        run: python scripts/bootstrap_catalog.py --target prod --profile ""

      - name: Validate
        run: databricks bundle validate --strict --target prod

      - name: Deploy
        run: databricks bundle deploy --target prod

      - name: Summary
        run: databricks bundle summary --target prod
